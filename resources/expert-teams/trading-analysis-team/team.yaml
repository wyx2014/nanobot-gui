schema_version: 1
id: trading-analysis-team
name: 股票交易分析团队
description: 十二位交易研究角色分阶段完成技术、基本面、事件、情绪、多空辩论、交易执行与风险裁决，输出可追溯的交易研究方案。
version: 1.0.0
source_root: source/trading-analysis
cover: source/trading-analysis/assets/trading-team.svg
entry_workflow: full-trading-analysis
enabled: true
tags:
  - 股票分析
  - 交易策略
  - 多空辩论
  - 风险管理
runtime:
  requested_concurrency: 4
  max_members: 12
  report_directory: reports
  adapter: adapter.md
  completion:
    required_tools:
      - write_file
      - create_docx
      - create_pdf
    required_artifacts:
      - html
      - docx
      - pdf
    instruction: 风险主管完成后必须继续首席策略官汇总、数据审校和三格式交付；只有最终报告工具已实际执行后才能结束。
  lead_playbooks:
    - playbooks/chief-strategist.md
    - playbooks/visual-delivery.md
data_sources:
  - id: ifind-finance-data
    name: 同花顺 iFinD 金融数据
    skill: ifind-finance-data
    priority: primary
    required: true
    description: 团队内置的优先结构化金融数据源，用于行情、财务、公告、新闻、资金、机构与行业数据，并可与已配置的聚源 MCP 交叉核验。
    assignments:
      market-analyst: 行情、日线、成交量与技术指标候选数据
      fundamentals-analyst: 财务指标、估值、分红与可比公司数据
      news-analyst: 公告、新闻、行业板块与政策线索
      sentiment-analyst: 资金流、研报评级、融资融券与机构持仓
mcp_presets:
  - name: juyuan
    display_name: 聚源金融数据 MCP
    required: false
    description: 工具箱已配置时由团队自动启用，补充行情、财务、估值、公告、资金与机构数据。
members:
  - id: market-analyst
    name: 技术分析师
    framework: 趋势、动量与量价
    description: 研究近 60 个交易日价格、均线、MACD、RSI、KDJ、成交量以及支撑阻力。
    phase: phase-1
    phase_label: 第一阶段 · 四维研究
    playbook: playbooks/market-analyst.md
  - id: fundamentals-analyst
    name: 基本面分析师
    framework: 财务质量与估值
    description: 研究增长、盈利、现金流、资产负债表、估值、分红和同业比较。
    phase: phase-1
    phase_label: 第一阶段 · 四维研究
    playbook: playbooks/fundamentals-analyst.md
  - id: news-analyst
    name: 新闻分析师
    framework: 公告、政策与催化
    description: 研究公司公告、行业政策、宏观变量、产业链信号和竞品动态。
    phase: phase-1
    phase_label: 第一阶段 · 四维研究
    playbook: playbooks/news-analyst.md
  - id: sentiment-analyst
    name: 情绪分析师
    framework: 资金、机构与热度
    description: 研究资金流、机构评级、融资融券、陆股通、龙虎榜和市场关注度。
    phase: phase-1
    phase_label: 第一阶段 · 四维研究
    playbook: playbooks/sentiment-analyst.md
  - id: bull-researcher
    name: 多头研究员
    framework: 上行驱动与催化
    description: 基于四维证据构建可被反驳的买入论证、目标区间与失效条件。
    phase: phase-2
    phase_label: 第二阶段 · 多空辩论
    playbook: playbooks/bull-researcher.md
  - id: bear-researcher
    name: 空头研究员
    framework: 下行风险与反证
    description: 逐一挑战多头论证，构建下行情景、风险收益比与看空闭环。
    phase: phase-2
    phase_label: 第二阶段 · 多空辩论
    playbook: playbooks/bear-researcher.md
  - id: research-manager
    name: 研究主管
    framework: 多空裁决与估值中枢
    description: 比较证据质量和论点权重，给出 BUY、SELL 或 HOLD 的研究方向。
    phase: phase-2
    phase_label: 第二阶段 · 多空辩论
    playbook: playbooks/research-manager.md
  - id: trader
    name: 交易员
    framework: 入场、目标与止损
    description: 把研究方向转化为分批入场、目标价、止损、仓位上限和交易节奏。
    phase: phase-3
    phase_label: 第三阶段 · 交易执行
    playbook: playbooks/trader.md
  - id: aggressive-risk-analyst
    name: 激进风险分析师
    framework: 上行机会与错失成本
    description: 检查交易方案是否过度保守，评估突破行情、催化兑现和机会成本。
    phase: phase-4
    phase_label: 第四阶段 · 风险辩论
    playbook: playbooks/aggressive-risk-analyst.md
  - id: conservative-risk-analyst
    name: 保守风险分析师
    framework: 尾部风险与本金保护
    description: 检查仓位、现金流、分红、基本面恶化和尾部亏损是否被低估。
    phase: phase-4
    phase_label: 第四阶段 · 风险辩论
    playbook: playbooks/conservative-risk-analyst.md
  - id: neutral-risk-analyst
    name: 中性风险分析师
    framework: 风险收益与条件仓位
    description: 同时挑战激进和保守观点，以分批、验证闸门和情景策略平衡风险。
    phase: phase-4
    phase_label: 第四阶段 · 风险辩论
    playbook: playbooks/neutral-risk-analyst.md
  - id: risk-manager
    name: 风险主管
    framework: 风险调整后最终裁决
    description: 裁决三方风险辩论，确定最终方向、仓位、价格计划和退出条件。
    phase: phase-5
    phase_label: 第五阶段 · 最终裁决
    playbook: playbooks/risk-manager.md
workflows:
  - id: full-trading-analysis
    name: 股票交易全流程分析
    description: 四维研究、多空辩论、交易提案、风险辩论和最终风险裁决。
    source: skills/full-trading-analysis.md
    mode: team
    featured: true
