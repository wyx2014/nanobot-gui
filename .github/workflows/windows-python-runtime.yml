name: Build Windows Installer

on:
  workflow_dispatch:
    inputs:
      nanobot_repository:
        description: Repository containing the nanobot runtime
        required: true
        default: wyx2014/nanobot
        type: string
      nanobot_ref:
        description: Branch, tag, or commit to embed
        required: true
        default: tpacowork-runtime
        type: string

permissions:
  contents: write

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-installer:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout TPCowork GUI
        uses: actions/checkout@v4
        with:
          path: nanobot-gui

      - name: Checkout nanobot
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.nanobot_repository }}
          ref: ${{ inputs.nanobot_ref }}
          path: nanobot
          token: ${{ secrets.NANOBOT_REPO_TOKEN || github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nanobot-gui/package-lock.json

      - name: Install GUI dependencies
        working-directory: nanobot-gui
        run: npm ci

      - name: Verify packaging contracts
        working-directory: nanobot-gui
        run: npm run test -- electron/pythonRuntimePackaging.test.ts electron/nodeRuntimePackaging.test.ts electron/packagingDependencies.test.ts

      - name: Build Windows installer with native Python runtime
        working-directory: nanobot-gui
        env:
          JUYUAN_MCP_TOKEN: ${{ secrets.JUYUAN_MCP_TOKEN }}
          CAIHUI_MCP_API_KEY: ${{ secrets.CAIHUI_MCP_API_KEY }}
          IFIND_MCP_API_KEY: ${{ secrets.IFIND_MCP_API_KEY }}
          ANYSEARCH_API_KEY: ${{ secrets.ANYSEARCH_API_KEY }}
          TPCOWORK_IMAGE_EXTRACT_API_KEY: ${{ secrets.TPCOWORK_IMAGE_EXTRACT_API_KEY }}
        run: npm run build:win

      - name: Smoke-test packaged Python runtime
        working-directory: nanobot-gui
        shell: pwsh
        run: |
          $python = "dist/installers/win-unpacked/resources/python/python.exe"
          if (!(Test-Path -LiteralPath $python)) {
            throw "Bundled Python not found: $python"
          }
          & $python -c "import nanobot; from nanobot.cli.commands import app; print(nanobot.__file__); print(type(app).__name__)"
          if ($LASTEXITCODE -ne 0) {
            throw "Bundled Python smoke test failed"
          }
          & $python scripts/check-python-commands.py
          if ($LASTEXITCODE -ne 0) { throw "Agent Python command smoke test failed" }
          $bundledNode = "dist/installers/win-unpacked/resources/node/node.exe"
          & $bundledNode --version
          if ($LASTEXITCODE -ne 0) { throw "Bundled Node smoke test failed" }
          & $bundledNode "dist/installers/win-unpacked/resources/node/npm/bin/npm-cli.js" --version
          if ($LASTEXITCODE -ne 0) { throw "Bundled npm smoke test failed" }
          & "dist/installers/win-unpacked/resources/node/npx.cmd" --version
          if ($LASTEXITCODE -ne 0) { throw "Bundled npx smoke test failed" }

      - name: Read package metadata and checksum
        id: package
        working-directory: nanobot-gui
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to read package version"
          }
          $installer = Get-ChildItem -LiteralPath "dist/installers" -File -Filter "*.exe" | Select-Object -First 1
          if (!$installer) {
            throw "NSIS installer not found"
          }
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($installer.Name)" | Set-Content -LiteralPath "$($installer.FullName).sha256" -Encoding ascii
          "installer_name=$($installer.Name)" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "release_tag=windows-installer-$version" >> $env:GITHUB_OUTPUT

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: TPCowork-${{ steps.package.outputs.version }}-windows-x64
          path: |
            nanobot-gui/dist/installers/${{ steps.package.outputs.installer_name }}
            nanobot-gui/dist/installers/${{ steps.package.outputs.installer_name }}.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish Windows installer prerelease
        working-directory: nanobot-gui
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.package.outputs.release_tag }}
          INSTALLER_NAME: ${{ steps.package.outputs.installer_name }}
          NANOBOT_REF: ${{ inputs.nanobot_ref }}
        run: |
          gh release view $env:RELEASE_TAG 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --prerelease --target $env:GITHUB_SHA --title "TPCowork ${{ steps.package.outputs.version }} Windows x64" --notes "Windows-built NSIS installer with embedded nanobot ref: $env:NANOBOT_REF"
          } else {
            gh release edit $env:RELEASE_TAG --prerelease
          }
          gh release upload $env:RELEASE_TAG `
            "dist/installers/$env:INSTALLER_NAME" `
            "dist/installers/$env:INSTALLER_NAME.sha256" `
            --clobber
