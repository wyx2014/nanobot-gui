name: Build Linux Python runtime

on:
  workflow_dispatch:
    inputs:
      nanobot_repository:
        description: Repository containing the nanobot runtime
        required: true
        default: wyx2014/nanobot
        type: string
      nanobot_ref:
        description: Branch, tag, or commit to embed
        required: true
        default: main
        type: string

permissions:
  contents: write

concurrency:
  group: linux-python-3.12.9-linux-x64
  cancel-in-progress: false

jobs:
  build-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout TPCowork GUI
        uses: actions/checkout@v4
        with:
          path: nanobot-gui

      - name: Checkout nanobot
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.nanobot_repository }}
          ref: ${{ inputs.nanobot_ref }}
          path: nanobot
          token: ${{ secrets.NANOBOT_REPO_TOKEN || github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build complete linux-x64 runtime
        working-directory: nanobot-gui
        run: node scripts/download-python.mjs --target linux-x64

      - name: Smoke-test and archive runtime
        working-directory: nanobot-gui
        run: node scripts/package-python-runtime.mjs --target linux-x64

      - name: Read release metadata
        id: runtime
        working-directory: nanobot-gui
        run: |
          metadata="$(node scripts/download-python.mjs --target linux-x64 --print-config)"
          echo "tag=$(jq -r .releaseTag <<<"$metadata")" >> "$GITHUB_OUTPUT"
          echo "archive=$(jq -r .archive <<<"$metadata")" >> "$GITHUB_OUTPUT"
          echo "checksum=$(jq -r .checksum <<<"$metadata")" >> "$GITHUB_OUTPUT"
          echo "manifest=$(jq -r .manifest <<<"$metadata")" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.runtime.outputs.archive }}
          path: nanobot-gui/dist/python-runtime/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish stable runtime release assets
        working-directory: nanobot-gui
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_TAG: ${{ steps.runtime.outputs.tag }}
          RUNTIME_ARCHIVE: ${{ steps.runtime.outputs.archive }}
          RUNTIME_CHECKSUM: ${{ steps.runtime.outputs.checksum }}
          RUNTIME_MANIFEST: ${{ steps.runtime.outputs.manifest }}
          NANOBOT_REF: ${{ inputs.nanobot_ref }}
        run: |
          if ! gh release view "$RUNTIME_TAG" >/dev/null 2>&1; then
            gh release create "$RUNTIME_TAG" --prerelease --target "$GITHUB_SHA" --title "TPCowork Linux Python 3.12.9 runtime" --notes "Prebuilt linux-x64 desktop runtime. Embedded nanobot ref: $NANOBOT_REF"
          else
            gh release edit "$RUNTIME_TAG" --prerelease
          fi
          gh release upload "$RUNTIME_TAG" \
            "dist/python-runtime/$RUNTIME_ARCHIVE" \
            "dist/python-runtime/$RUNTIME_CHECKSUM" \
            "dist/python-runtime/$RUNTIME_MANIFEST" \
            --clobber
