schema_version: 1
id: asset-research-team
name: 资产投研团队
description: 四位研究专家并行完成商业、财务、行业与风险分析，由 Team Lead 交叉质证并输出最终报告。
version: 1.0.0
source_root: source/ai-berkshire
cover: source/ai-berkshire/assets/team-core.svg
entry_workflow: investment-team
enabled: true
tags:
  - 投资研究
  - 财务分析
  - 行业研究
  - 风险评估
runtime:
  requested_concurrency: 4
  max_members: 4
  report_directory: reports
  adapter: adapter.md
  completion:
    required_tools:
      - write_file
    required_artifacts:
      - html
    instruction: 即使部分数据源或成员失败，也必须基于已核验材料生成最终 Markdown 与 HTML 报告，并在报告中标注缺口、冲突和置信度。
mcp_presets:
  - name: hexin-ifind-ds-stock-mcp
    display_name: 同花顺 iFinD 股票 MCP
    required: false
    description: 已配置时用于 A 股行情、公司资料和股票结构化字段，并与聚源、财汇按字段交叉核验。
  - name: hexin-ifind-ds-news-mcp
    display_name: 同花顺 iFinD 新闻 MCP
    required: false
    description: 已配置时用于公司新闻和事件核验。
  - name: hexin-ifind-ds-edb-mcp
    display_name: 同花顺 iFinD 宏观 MCP
    required: false
    description: 已配置时用于行业和宏观经济序列。
  - name: hexin-ifind-ds-index-mcp
    display_name: 同花顺 iFinD 指数 MCP
    required: false
    description: 已配置时用于板块、指数和基准对比数据。
  - name: juyuan
    display_name: 聚源金融数据 MCP
    required: false
    description: 工具箱已配置时由团队自动启用，提供行情、财务、估值、公告与机构数据。
  - name: caihui_mcp
    display_name: 财汇金融数据 MCP
    required: false
    description: 已配置时提供 A 股公司、财务、行情和公告数据，参与关键字段三源核验。
  - name: anysearch
    display_name: AnySearch MCP
    required: false
    description: iFinD、聚源、财汇对同一字段均不可用时的第一层公开资料兜底。
members:
  - id: business-analyst
    name: 商业分析师
    framework: 段永平视角
    description: 分析商业模式、生意属性与护城河；优先使用同花顺公司摘要、主营构成和公告数据。
  - id: financial-analyst
    name: 财务分析师
    framework: 巴菲特视角
    description: 分析财务质量、自由现金流、安全边际与估值；以同花顺财务数据作为结构化底表。
  - id: industry-researcher
    name: 行业研究员
    framework: 芒格视角
    description: 分析行业格局、竞争优势与长期结构变化；优先使用同花顺板块和可比公司数据。
  - id: risk-assessor
    name: 风险评估师
    framework: 李录视角
    description: 分析管理层、治理、下行风险与永久损失概率；优先核查同花顺公告和风险新闻。
workflows:
  - { id: investment-team, name: 团队深度投研, source: skills/investment-team.md, mode: team, featured: true }
  - { id: earnings-team, name: 团队财报复盘, source: skills/earnings-team.md, mode: team, featured: true }
  - { id: investment-research, name: 公司深度研究, source: skills/investment-research.md, mode: lead, featured: true }
  - { id: industry-research, name: 行业深度研究, source: skills/industry-research.md, mode: lead, featured: true }
  - { id: private-company-research, name: 非上市公司研究, source: skills/private-company-research.md, mode: lead, featured: true }
  - { id: portfolio-review, name: 投资组合复盘, source: skills/portfolio-review.md, mode: lead, featured: true }
  - { id: bottleneck-hunter, name: 产业瓶颈发现, source: skills/bottleneck-hunter.md, mode: lead, featured: false }
  - { id: deep-company-series, name: 公司系列深挖, source: skills/deep-company-series.md, mode: lead, featured: false }
  - { id: dyp-ask, name: 段永平视角问答, source: skills/dyp-ask.md, mode: lead, featured: false }
  - { id: earnings-review, name: 财报复盘, source: skills/earnings-review.md, mode: lead, featured: false }
  - { id: financial-data, name: 财务数据规范, source: skills/financial-data.md, mode: lead, featured: false }
  - { id: industry-funnel, name: 行业漏斗筛选, source: skills/industry-funnel.md, mode: lead, featured: false }
  - { id: investment-checklist, name: 投资检查清单, source: skills/investment-checklist.md, mode: lead, featured: false }
