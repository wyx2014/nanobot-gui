<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">股票交易分析团队</title>
  <desc id="desc">四维研究经过多空辩论、交易执行和风险裁决形成最终方案。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172033"/>
      <stop offset="1" stop-color="#3156d3"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1l7 4-7 4" fill="none" stroke="#62708e" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="960" height="540" rx="32" fill="#f6f3ed"/>
  <rect x="28" y="28" width="904" height="484" rx="26" fill="url(#bg)"/>
  <text x="72" y="92" fill="#fff" font-family="PingFang SC, sans-serif" font-size="30" font-weight="700">股票交易分析团队</text>
  <text x="72" y="126" fill="#cbd7ff" font-family="PingFang SC, sans-serif" font-size="16">证据取数 · 多空辩论 · 交易执行 · 风险裁决</text>
  <g font-family="PingFang SC, sans-serif">
    <g fill="#fff">
      <rect x="72" y="174" width="150" height="76" rx="16" opacity=".96"/>
      <rect x="240" y="174" width="150" height="76" rx="16" opacity=".96"/>
      <rect x="408" y="174" width="150" height="76" rx="16" opacity=".96"/>
      <rect x="576" y="174" width="150" height="76" rx="16" opacity=".96"/>
    </g>
    <g fill="#253253" font-size="17" font-weight="650" text-anchor="middle">
      <text x="147" y="207">技术分析</text><text x="147" y="231" font-size="12" font-weight="400">趋势与量价</text>
      <text x="315" y="207">基本面</text><text x="315" y="231" font-size="12" font-weight="400">财务与估值</text>
      <text x="483" y="207">新闻事件</text><text x="483" y="231" font-size="12" font-weight="400">公告与催化</text>
      <text x="651" y="207">资金情绪</text><text x="651" y="231" font-size="12" font-weight="400">机构与热度</text>
    </g>
    <path d="M399 270v38" stroke="#9eb2f0" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="286" y="318" width="226" height="64" rx="18" fill="#fff0e8"/>
    <text x="399" y="347" fill="#9c4e35" font-size="18" font-weight="700" text-anchor="middle">多头 ⇄ 空头</text>
    <text x="399" y="369" fill="#b06a52" font-size="12" text-anchor="middle">研究主管裁决</text>
    <path d="M512 350h60" stroke="#9eb2f0" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="588" y="318" width="138" height="64" rx="18" fill="#e9f7f2"/>
    <text x="657" y="347" fill="#13735f" font-size="18" font-weight="700" text-anchor="middle">交易员</text>
    <text x="657" y="369" fill="#438b7c" font-size="12" text-anchor="middle">价格与仓位</text>
    <path d="M657 382v38" stroke="#9eb2f0" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="520" y="430" width="274" height="52" rx="18" fill="#fff"/>
    <text x="657" y="462" fill="#253253" font-size="17" font-weight="700" text-anchor="middle">三方风险辩论 → 风险主管定案</text>
  </g>
</svg>
