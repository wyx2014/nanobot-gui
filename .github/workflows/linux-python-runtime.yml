name: Build Linux Packages

on:
  workflow_dispatch:
    inputs:
      nanobot_repository:
        description: Repository containing the nanobot runtime
        required: true
        default: wyx2014/nanobot
        type: string
      nanobot_ref:
        description: Branch, tag, or commit to embed
        required: true
        default: tpacowork-runtime
        type: string

permissions:
  contents: write

concurrency:
  group: linux-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-packages:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout TPCowork GUI
        uses: actions/checkout@v4
        with:
          path: nanobot-gui

      - name: Checkout nanobot
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.nanobot_repository }}
          ref: ${{ inputs.nanobot_ref }}
          path: nanobot
          token: ${{ secrets.NANOBOT_REPO_TOKEN || github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nanobot-gui/package-lock.json

      - name: Install GUI dependencies
        working-directory: nanobot-gui
        run: npm ci

      - name: Verify packaging contracts
        working-directory: nanobot-gui
        run: npm run test -- electron/pythonRuntimePackaging.test.ts electron/packagingDependencies.test.ts

      - name: Build Linux packages with native Python runtime
        working-directory: nanobot-gui
        env:
          JUYUAN_MCP_TOKEN: ${{ secrets.JUYUAN_MCP_TOKEN }}
          CAIHUI_MCP_API_KEY: ${{ secrets.CAIHUI_MCP_API_KEY }}
          IFIND_MCP_API_KEY: ${{ secrets.IFIND_MCP_API_KEY }}
          ANYSEARCH_API_KEY: ${{ secrets.ANYSEARCH_API_KEY }}
          TPCOWORK_IMAGE_EXTRACT_API_KEY: ${{ secrets.TPCOWORK_IMAGE_EXTRACT_API_KEY }}
        run: npm run build:linux

      - name: Smoke-test AppImage and DEB runtimes
        working-directory: nanobot-gui
        run: |
          set -euo pipefail
          appimage="$(find dist/installers -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          deb="$(find dist/installers -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$appimage"
          test -n "$deb"
          chmod +x "$appimage"
          "$appimage" --appimage-extract >/dev/null
          test -x squashfs-root/resources/python/bin/python3
          squashfs-root/resources/python/bin/python3 -c "import nanobot; from nanobot.cli.commands import app; print(nanobot.__file__); print(type(app).__name__)"
          broken_link="$(find squashfs-root/resources/python -xtype l -print -quit)"
          test -z "$broken_link"

          dpkg-deb --info "$deb" >/dev/null
          deb_control="$(mktemp -d)"
          dpkg-deb --control "$deb" "$deb_control"
          grep -q '/var/lib/tpcowork/installation-id' "$deb_control/postinst"
          grep -q '/var/lib/tpcowork/installation-id' "$deb_control/postrm"
          deb_root="$(mktemp -d)"
          dpkg-deb --extract "$deb" "$deb_root"
          deb_python="$(find "$deb_root" -path '*/resources/python/bin/python3' -print -quit)"
          test -n "$deb_python"
          test -x "$deb_python"
          "$deb_python" -c "import nanobot; from nanobot.cli.commands import app; print(nanobot.__file__); print(type(app).__name__)"
          deb_runtime="$(dirname "$(dirname "$deb_python")")"
          broken_link="$(find "$deb_runtime" -xtype l -print -quit)"
          test -z "$broken_link"
          desktop_entry="$(find "$deb_root/usr/share/applications" -type f -name '*.desktop' -print -quit)"
          test -n "$desktop_entry"
          grep -q '^Exec=' "$desktop_entry"
          grep -q '^Name=TPCowork$' "$desktop_entry"
          grep -q '^Categories=Office;Utility;$' "$desktop_entry"
          grep -q '^Comment=AI Desktop Office Assistant$' "$desktop_entry"
          grep -q '^StartupWMClass=TPCowork$' "$desktop_entry"
          grep -q '^X-TPCowork-ManagedShortcut=true$' "$desktop_entry"
          grep -q 'desktop_dir_for_user' "$deb_control/postinst"
          grep -q 'metadata::trusted true' "$deb_control/postinst"

      - name: Read package metadata and checksum
        id: package
        working-directory: nanobot-gui
        run: |
          set -euo pipefail
          appimage="$(find dist/installers -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          deb="$(find dist/installers -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$appimage"
          test -n "$deb"
          appimage_name="$(basename "$appimage")"
          deb_name="$(basename "$deb")"
          version="$(node -p "require('./package.json').version")"
          (cd "$(dirname "$appimage")" && sha256sum "$appimage_name" > "$appimage_name.sha256")
          (cd "$(dirname "$deb")" && sha256sum "$deb_name" > "$deb_name.sha256")
          echo "appimage=$appimage" >> "$GITHUB_OUTPUT"
          echo "appimage_name=$appimage_name" >> "$GITHUB_OUTPUT"
          echo "deb=$deb" >> "$GITHUB_OUTPUT"
          echo "deb_name=$deb_name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_tag=linux-packages-$version" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: TPCowork-${{ steps.package.outputs.version }}-linux-x64
          path: |
            nanobot-gui/${{ steps.package.outputs.appimage }}
            nanobot-gui/${{ steps.package.outputs.appimage }}.sha256
            nanobot-gui/${{ steps.package.outputs.deb }}
            nanobot-gui/${{ steps.package.outputs.deb }}.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish Linux packages prerelease
        working-directory: nanobot-gui
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.package.outputs.release_tag }}
          APPIMAGE_NAME: ${{ steps.package.outputs.appimage_name }}
          DEB_NAME: ${{ steps.package.outputs.deb_name }}
          NANOBOT_REF: ${{ inputs.nanobot_ref }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --prerelease --target "$GITHUB_SHA" --title "TPCowork ${{ steps.package.outputs.version }} Linux x64" --notes "Ubuntu-built AppImage and DEB with embedded nanobot ref: $NANOBOT_REF"
          else
            gh release edit "$RELEASE_TAG" --prerelease
          fi
          gh release upload "$RELEASE_TAG" \
            "dist/installers/$APPIMAGE_NAME" \
            "dist/installers/$APPIMAGE_NAME.sha256" \
            "dist/installers/$DEB_NAME" \
            "dist/installers/$DEB_NAME.sha256" \
            --clobber
